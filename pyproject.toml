[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kbeauty-analysis"
version = "0.1.0"
description = "K-beauty Amazon market and TikTok virality analysis"
requires-python = ">=3.10"
dependencies = [
    # 공통
    "pandas>=2.0",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # 무료 LLM provider (Groq + Gemini) — src/util/llm_provider.py
    # gradio 가 transitive 로 가져오지만 src/util/llm_provider 가 직접 의존이라
    # 명시적 등록 (gradio 떼낼 때 끊김 방지).
    "httpx>=0.24",
    # GraphRAG 추천 챗봇 (ollama + cosmetic_rag_chat 둘 다)
    "gradio>=4.0",
    "lancedb>=0.5",
    "llama-index>=0.10",
    "llama-index-embeddings-huggingface",
    "llama-index-llms-ollama",
    "llama-index-vector-stores-lancedb",
    "graphrag>=0.3.0",
    "tiktoken>=0.5",
    "ollama>=0.1.7",
]

[project.optional-dependencies]
# 분석 노트북 + Amazon TF-IDF/LDA 작업 시
analysis = [
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "gensim>=4.3",
    "nltk>=3.8",
    "spacy>=3.7",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "plotly>=5.17",
    "pyldavis>=3.4",
    "wordcloud>=1.9",
    "scipy>=1.11",
]
# 크롤러 (Amazon · TikTok) 실행 시
crawler = [
    "selenium>=4.15",
    "playwright>=1.40",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "requests>=2.31",
]
# 모든 의존성 한 번에
all = [
    "kbeauty-analysis[analysis,crawler]",
]

[tool.setuptools.packages.find]
where = ["src"]
